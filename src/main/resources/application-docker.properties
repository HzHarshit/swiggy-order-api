
spring.application.name=swiggy-order-api

server.port=8085

# MySQL running on Windows


spring.datasource.url=jdbc:mysql://host.docker.internal:3306/swiggydb
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis container exposed on Windows
spring.data.redis.host=host.docker.internal
spring.data.redis.port=6379

# Kafka exposed on Windows
spring.kafka.bootstrap-servers=kafka:29092

# Consumer configuration
spring.kafka.consumer.group-id=swiggy-order-group
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka consumer deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.swiggy.event
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.swiggy.event.OrderCreatedEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
